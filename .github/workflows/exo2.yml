name: Exo2

on:
  push:
    branches: [ main ]
    paths: 
      - 'exo2/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: exo2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add .env file
        run: |
          cp .env.example .env

      - name: Bring up compose
        run: |
          docker compose -f compose.yml up -d

      - name: Healthcheck
        run: |
          sleep 10 # Wait for nextcloud to be up
          curl -f http://localhost:8080 || exit 1
    
      - name: Shut down compose
        run: |
          docker compose -f compose.yml down